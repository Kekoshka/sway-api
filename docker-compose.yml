services:
  api:
    build: .
    container_name: sway-api
    restart: always
    ports:
      - "5001:80"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://192.168.0.5:3306/default_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
