services:
  api:
    build: .
    container_name: sway-api
    restart: always
    ports:
      - "5001:80"
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://192.168.0.5:3306/default_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: gen_user
      SPRING_DATASOURCE_PASSWORD: Vay-{R0UAb9*-v
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
