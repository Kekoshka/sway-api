services:
  db:
    image: mysql:8.0
    container_name: sway-db
    restart: always
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: default_db
      MYSQL_USER: gen_user
      MYSQL_PASSWORD: I,H5QAbohqroPr
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: .
    container_name: sway-api
    restart: always
    ports:
      - "6001:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/default_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: gen_user
      SPRING_DATASOURCE_PASSWORD: I,H5QAbohqroPr
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db

volumes:
  mysql_data:
